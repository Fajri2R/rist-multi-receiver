services:
  rist-multi-receiver:
    build: .
    container_name: rist-multi-receiver
    restart: unless-stopped
    environment:
      - HOST_IP=${HOST_IP:-}
      - RIST_PUBLIC_HOST=${RIST_PUBLIC_HOST:-live.ashveil.my.id}
    ports:
      # Management Web UI and NOALBS Stats API.
      # Bound to loopback on purpose: the public entry point is
      # https://rist.ashveil.my.id (nginx -> 127.0.0.1:3001).
      - "127.0.0.1:${PORT:-3000}:3000/tcp"
      # Input Ports for streamers (IRLBOX / IRLWhatever)
      - "2030-2050:2030-2050/udp"
      # Output Ports for OBS Studio
      - "5556-5576:5556-5576/udp"
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

