<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RIST Multi Receiver</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background:#0f1117; color:#e2e8f0; min-height:100vh; }

    header { background:#161b22; border-bottom:1px solid #30363d; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; }
    header h1 { font-size:20px; font-weight:700; color:#58a6ff; letter-spacing:.5px; }
    header span { font-size:12px; color:#8b949e; background:#0d1117; padding:4px 10px; border-radius:8px; border:1px solid #30363d; }

    main { max-width:1100px; margin:0 auto; padding:28px 20px; }

    .actions { display:flex; gap:12px; margin-bottom:28px; }
    .btn { cursor:pointer; border:none; border-radius:8px; padding:10px 20px; font-size:14px; font-weight:600; transition:all .15s; }
    .btn-primary { background:#238636; color:#fff; }
    .btn-primary:hover { background:#2ea043; }
    .btn-danger { background:#da3633; color:#fff; }
    .btn-danger:hover { background:#f85149; }

    .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px,1fr)); gap:18px; }
    .card { background:#161b22; border:1px solid #30363d; border-radius:12px; padding:20px; position:relative; }
    .card.online { border-left:4px solid #2ea043; }
    .card.offline { border-left:4px solid #f85149; }

    .card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
    .card-header .name { font-size:16px; font-weight:700; }
    .status-dot { width:10px; height:10px; border-radius:50%; }
    .status-dot.on { background:#2ea043; box-shadow:0 0 6px #2ea043; }
    .status-dot.off { background:#f85149; }

    .info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; margin-bottom:16px; }
    .info-item { }
    .info-label { font-size:10px; text-transform:uppercase; color:#8b949e; letter-spacing:.5px; }
    .info-value { font-size:13px; color:#c9d1d9; font-family:monospace; margin-top:2px; word-break:break-all; }

    .metrics { display:flex; gap:12px; margin-bottom:16px; }
    .metric-box { flex:1; background:#0d1117; border-radius:8px; padding:10px; text-align:center; }
    .metric-box .val { font-size:20px; font-weight:700; color:#58a6ff; }
    .metric-box .lbl { font-size:10px; color:#8b949e; margin-top:2px; }

    .copy-row { display:flex; gap:8px; align-items:center; background:#0d1117; border-radius:8px; padding:8px 12px; margin-bottom:8px; font-size:12px; font-family:monospace; }
    .copy-row span { flex:1; color:#8b949e; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .copy-btn { background:#30363d; border:none; color:#c9d1d9; border-radius:5px; padding:3px 8px; cursor:pointer; font-size:11px; flex-shrink:0; }
    .copy-btn:hover { background:#58a6ff; color:#0d1117; }
    .copy-row .url-label { color:#58a6ff; margin-right:6px; flex-shrink:0; font-weight:700; }

    .del-btn { position:absolute; top:14px; right:14px; background:transparent; border:1px solid #30363d; color:#8b949e; border-radius:6px; padding:3px 9px; cursor:pointer; font-size:12px; }
    .del-btn:hover { border-color:#f85149; color:#f85149; }

    /* Modal */
    .modal-bg { display:none; position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:100; align-items:center; justify-content:center; }
    .modal-bg.show { display:flex; }
    .modal { background:#161b22; border:1px solid #30363d; border-radius:14px; padding:28px; width:420px; max-width:95vw; }
    .modal h2 { margin-bottom:20px; font-size:18px; }
    label { display:block; font-size:13px; color:#8b949e; margin-bottom:4px; }
    input { width:100%; background:#0d1117; border:1px solid #30363d; color:#e2e8f0; padding:9px 12px; border-radius:8px; font-size:14px; margin-bottom:14px; }
    input:focus { outline:none; border-color:#58a6ff; }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:6px; }
    .btn-cancel { background:#21262d; color:#c9d1d9; }
    .btn-cancel:hover { background:#30363d; }

    .empty { text-align:center; color:#8b949e; padding:60px 20px; font-size:15px; }
    .empty span { font-size:40px; display:block; margin-bottom:12px; }
    .noalbs-note { background:#161b22; border:1px solid #1f6feb; border-radius:10px; padding:14px 18px; margin-bottom:24px; font-size:13px; color:#58a6ff; }
    .noalbs-note strong { color:#79c0ff; }
  </style>
</head>
<body>
  <header>
    <h1>🎙️ RIST Multi Receiver</h1>
    <span id="streamCount">Loading…</span>
  </header>
  <main>
    <div class="noalbs-note">
      <strong>NOALBS Integration:</strong> Use stats URL format <code>http://&lt;your-server&gt;:3000/stats/&lt;streamId&gt;</code> — type: <code>OpenIRL</code>
    </div>
    <div class="actions">
      <button class="btn btn-primary" onclick="showModal()">+ Add Stream</button>
    </div>
    <div class="cards" id="cards"></div>
  </main>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>New RIST Stream</h2>
      <label>Stream Name</label>
      <input id="mName" type="text" placeholder="e.g. Camera 1" />
      <label>RIST Username</label>
      <input id="mUser" type="text" placeholder="streamer" />
      <label>RIST Password</label>
      <input id="mPass" type="text" placeholder="strongpassword123" />
      <div class="modal-actions">
        <button class="btn btn-cancel" onclick="hideModal()">Cancel</button>
        <button class="btn btn-primary" onclick="createStream()">Create</button>
      </div>
    </div>
  </div>

  <script>
    let streams = [];

    async function fetchStreams() {
      const res = await fetch('/api/streams');
      streams = await res.json();
      render();
    }

    function render() {
      const el = document.getElementById('cards');
      document.getElementById('streamCount').textContent = `${streams.length} stream${streams.length !== 1 ? 's' : ''}`;
      if (!streams.length) {
        el.innerHTML = '<div class="empty"><span>📡</span>No streams yet. Click "Add Stream" to begin.</div>';
        return;
      }

      el.innerHTML = streams.map(s => {
        const stats = s.liveStats || {};
        const online = stats.online;
        const bitrate = stats.bitrate ? `${(stats.bitrate/1000).toFixed(1)} kbps` : '—';
        const rtt = stats.rtt ? `${stats.rtt} ms` : '—';
        const hostname = window.location.hostname;

        const publishUrl = `rist://${hostname}:${s.receivePort}?username=${s.username}&password=${s.password}`;
        const playUrl = `rist://${hostname}:${s.forwardPort}`;
        const statsUrl = `http://${hostname}:3000/stats/${s.streamId}`;

        return `
          <div class="card ${online ? 'online' : 'offline'}">
            <button class="del-btn" onclick="deleteStream('${s.id}')">✕</button>
            <div class="card-header">
              <span class="name">${s.name}</span>
              <div class="status-dot ${online ? 'on' : 'off'}"></div>
            </div>
            <div class="metrics">
              <div class="metric-box">
                <div class="val">${bitrate}</div>
                <div class="lbl">Bitrate</div>
              </div>
              <div class="metric-box">
                <div class="val">${rtt}</div>
                <div class="lbl">RTT</div>
              </div>
              <div class="metric-box">
                <div class="val">${online ? 'ON' : 'OFF'}</div>
                <div class="lbl">Status</div>
              </div>
            </div>
            <div class="info-grid">
              <div class="info-item"><div class="info-label">Receive Port</div><div class="info-value">${s.receivePort}/udp</div></div>
              <div class="info-item"><div class="info-label">Forward Port</div><div class="info-value">${s.forwardPort}/udp</div></div>
              <div class="info-item"><div class="info-label">Username</div><div class="info-value">${s.username}</div></div>
              <div class="info-item"><div class="info-label">Password</div><div class="info-value">${s.password}</div></div>
            </div>
            <div class="copy-row"><span class="url-label">PUB</span><span title="${publishUrl}">${publishUrl}</span><button class="copy-btn" onclick="copy('${publishUrl}')">Copy</button></div>
            <div class="copy-row"><span class="url-label">PLAY</span><span title="${playUrl}">${playUrl}</span><button class="copy-btn" onclick="copy('${playUrl}')">Copy</button></div>
            <div class="copy-row"><span class="url-label">STATS</span><span title="${statsUrl}">${statsUrl}</span><button class="copy-btn" onclick="copy('${statsUrl}')">Copy</button></div>
          </div>
        `;
      }).join('');
    }

    async function createStream() {
      const name = document.getElementById('mName').value.trim();
      const username = document.getElementById('mUser').value.trim();
      const password = document.getElementById('mPass').value.trim();
      if (!name || !username || !password) return alert('Please fill all fields.');
      await fetch('/api/streams', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, username, password }) });
      hideModal();
      await fetchStreams();
    }

    async function deleteStream(id) {
      if (!confirm('Delete this stream?')) return;
      await fetch(`/api/streams/${id}`, { method: 'DELETE' });
      await fetchStreams();
    }

    function copy(text) {
      navigator.clipboard.writeText(text).then(() => alert('Copied!'));
    }

    function showModal() {
      document.getElementById('modalBg').classList.add('show');
    }

    function hideModal() {
      document.getElementById('modalBg').classList.remove('show');
      document.getElementById('mName').value = '';
      document.getElementById('mUser').value = '';
      document.getElementById('mPass').value = '';
    }

    document.getElementById('modalBg').addEventListener('click', (e) => {
      if (e.target === document.getElementById('modalBg')) hideModal();
    });

    fetchStreams();
    setInterval(fetchStreams, 3000); // auto-refresh stats every 3s
  </script>
</body>
</html>
